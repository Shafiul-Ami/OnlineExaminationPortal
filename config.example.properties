# ExamSphere configuration
# Copy this file to config.properties and fill in your own values.
# (run.bat / run.sh do the copy automatically on first run.)
# Any key can also be set as an environment variable, e.g. db.password -> DB_PASSWORD

# PostgreSQL (the database is created automatically on first run)
db.host=localhost
db.port=5432
db.name=exam_portal
db.user=postgres
db.password=YOUR_POSTGRES_PASSWORD

# Web server
server.port=8080

# First admin account (created only if no admin exists yet)
admin.name=Administrator
admin.email=admin@exam.com
admin.password=Admin@123

# Load sample subjects/topics/questions when the database is empty
seed.sample=true
