<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test in progress · ExamSphere</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/app.js"></script>
</head>
<body>
  <header class="exam-bar">
    <div class="container">
      <span class="brand-mark" id="logo"></span>
      <div class="exam-title"><strong id="title">Loading test…</strong><span id="subtitle"></span></div>
      <div class="timer" id="timer" role="timer" aria-live="off"><span id="timerIcon"></span><span id="time">--:--</span></div>
      <button class="btn btn-primary" id="submitTop"><span id="sendIcon"></span><span>Submit</span></button>
    </div>
    <div class="exam-progress"><span id="progress"></span></div>
  </header>

  <main class="container">
    <div class="exam-layout" id="layout">
      <section class="card q-card" id="qCard"><div class="skeleton" style="height:320px"></div></section>
      <aside class="card palette-card">
        <div class="card-head" style="margin-bottom:0"><h3>Questions</h3><span class="chip" id="answeredChip">0 answered</span></div>
        <div class="palette" id="palette"></div>
        <div class="pal-legend">
          <span><i style="background:var(--ok);border-color:var(--ok)"></i>Answered</span>
          <span><i style="background:var(--warn);border-color:var(--warn)"></i>Marked for review</span>
          <span><i></i>Not answered</span>
          <span><i style="outline:2px solid rgba(139,92,246,.5);outline-offset:1px"></i>Current</span>
        </div>
        <p class="muted" style="font-size:.8rem;margin:0">Shortcuts: <span class="kbd">A</span>–<span class="kbd">D</span> or <span class="kbd">1</span>–<span class="kbd">4</span> select · <span class="kbd">←</span> <span class="kbd">→</span> navigate · <span class="kbd">M</span> mark</p>
      </aside>
    </div>
  </main>

<script>
(async () => {
  const { icon, esc, api, $ } = App;
  await App.init({ role: 'STUDENT', nav: false });
  $('#logo').innerHTML = icon('logo');
  $('#timerIcon').innerHTML = icon('clock');
  $('#sendIcon').innerHTML = icon('send');

  const id = App.qs('id');
  if (!id) { App.go('/student/exams.html'); return; }
  const KEY = 'examsphere-attempt-' + id;

  let paper;
  try { paper = await api('/api/exams/' + id); }
  catch (e) { $('#qCard').innerHTML = App.emptyState('alert', 'Test not found', e.message, `<a class="btn btn-primary" href="/student/exams.html">Back to tests</a>`); return; }
  if (paper.status !== 'IN_PROGRESS') { App.go('/result.html?id=' + id, { replace: true }); return; }

  const qs = paper.questions;
  let state = { idx: 0, answers: {}, marked: [] };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch { /* fresh start */ }
  const marked = new Set(state.marked);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ idx: state.idx, answers: state.answers, marked: [...marked] })); } catch {} };

  $('#title').textContent = paper.subjectName + (paper.topicName ? ' · ' + paper.topicName : '');
  $('#subtitle').textContent = `${qs.length} questions · ${Math.round(paper.durationSec / 60)} minutes`;
  document.title = paper.subjectName + ' test · ExamSphere';

  const LETTERS = ['A', 'B', 'C', 'D'];
  const optText = (q, L) => q['option' + L];

  function renderQuestion() {
    const q = qs[state.idx];
    const sel = state.answers[q.id];
    $('#qCard').innerHTML = `
      <div class="q-meta"><span class="q-num">Question ${state.idx + 1} / ${qs.length}</span>${App.diffChip(q.difficulty)}<span class="chip">${esc(q.topic)}</span></div>
      <div class="q-text">${esc(q.questionText)}</div>
      <div class="options" role="radiogroup" aria-label="Answer options">
        ${LETTERS.map((L) => `<button class="option ${sel === L ? 'selected' : ''}" role="radio" aria-checked="${sel === L}" data-l="${L}"><span class="letter">${L}</span><span class="opt-text">${esc(optText(q, L))}</span></button>`).join('')}
      </div>
      <div class="q-nav">
        <div class="group">
          <button class="btn btn-ghost" id="prev" ${state.idx === 0 ? 'disabled' : ''}>${icon('chevronLeft')} Previous</button>
          <button class="btn btn-ghost" id="mark">${icon('flag')} ${marked.has(q.id) ? 'Unmark' : 'Mark for review'}</button>
          <button class="btn btn-ghost" id="clear" ${sel ? '' : 'disabled'}>${icon('eraser')} Clear</button>
        </div>
        ${state.idx < qs.length - 1
          ? `<button class="btn btn-primary" id="next">Save &amp; next ${icon('chevronRight')}</button>`
          : `<button class="btn btn-primary" id="finish">${icon('send')} Finish test</button>`}
      </div>`;
    $('#qCard').querySelectorAll('.option').forEach((b) => b.addEventListener('click', () => choose(b.dataset.l)));
    $('#prev').addEventListener('click', () => go(state.idx - 1));
    $('#mark').addEventListener('click', toggleMark);
    $('#clear').addEventListener('click', () => { delete state.answers[q.id]; save(); renderAll(); });
    const next = $('#next'); if (next) next.addEventListener('click', () => go(state.idx + 1));
    const fin = $('#finish'); if (fin) fin.addEventListener('click', confirmSubmit);
  }

  function renderPalette() {
    const answered = qs.filter((q) => state.answers[q.id]).length;
    $('#palette').innerHTML = qs.map((q, i) => {
      const cls = [state.answers[q.id] && 'answered', marked.has(q.id) && 'marked', i === state.idx && 'current'].filter(Boolean).join(' ');
      return `<button class="pal-btn ${cls}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`;
    }).join('');
    $('#palette').querySelectorAll('.pal-btn').forEach((b) => b.addEventListener('click', () => go(+b.dataset.i)));
    $('#answeredChip').textContent = `${answered} / ${qs.length} answered`;
    $('#progress').style.width = (answered / qs.length) * 100 + '%';
  }

  function renderAll() { renderQuestion(); renderPalette(); }
  function go(i) { if (i < 0 || i >= qs.length) return; state.idx = i; save(); renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function choose(L) { state.answers[qs[state.idx].id] = L; save(); renderAll(); }
  function toggleMark() { const qid = qs[state.idx].id; marked.has(qid) ? marked.delete(qid) : marked.add(qid); save(); renderAll(); }

  if (state.idx >= qs.length) state.idx = 0;
  renderAll();

  // ---- keyboard ----
  document.addEventListener('keydown', (e) => {
    if (document.querySelector('.modal-backdrop') || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (LETTERS.includes(k)) choose(k);
    else if (['1', '2', '3', '4'].includes(k)) choose(LETTERS[+k - 1]);
    else if (e.key === 'ArrowRight') go(state.idx + 1);
    else if (e.key === 'ArrowLeft') go(state.idx - 1);
    else if (k === 'M') toggleMark();
  });

  // ---- timer ----
  const deadline = Date.now() + paper.remainingSec * 1000;
  let submitting = false;
  const tick = () => {
    const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
    const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
    $('#time').textContent = (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
    $('#timer').classList.toggle('low', left <= 60);
    if (left === 60) App.toast('One minute remaining!', 'info');
    if (left <= 0 && !submitting) { clearInterval(timerId); App.toast('Time is up! Submitting your answers…', 'info'); submit(); }
  };
  const timerId = setInterval(tick, 1000);
  tick();

  // ---- submit ----
  function confirmSubmit() {
    const answered = qs.filter((q) => state.answers[q.id]).length;
    const unanswered = qs.length - answered;
    App.modal({
      title: 'Submit test?',
      body: `
        <div class="mini-stats" style="grid-template-columns:repeat(3,1fr);margin:0 0 16px">
          <div class="mini-stat"><strong style="color:var(--ok)">${answered}</strong><span>Answered</span></div>
          <div class="mini-stat"><strong style="color:var(--warn)">${marked.size}</strong><span>Marked</span></div>
          <div class="mini-stat"><strong style="color:var(--bad)">${unanswered}</strong><span>Unanswered</span></div>
        </div>
        <p class="muted" style="margin:0">${unanswered ? `You still have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. ` : 'All questions answered. '}You cannot change your answers after submitting.</p>`,
      footer: `<button class="btn btn-ghost" data-close>Keep working</button><button class="btn btn-primary" id="doSubmit" data-busy="Submitting…">${icon('send')} Submit now</button>`,
      onOpen(el) { el.querySelector('#doSubmit').addEventListener('click', (e) => App.busy(e.currentTarget, submit)); },
    });
  }
  $('#submitTop').addEventListener('click', confirmSubmit);

  async function submit() {
    if (submitting) return;
    submitting = true;
    try {
      await api(`/api/exams/${id}/submit`, { method: 'POST', body: { answers: state.answers } });
    } catch (e) {
      if (e.status !== 409) { submitting = false; App.toast(e.message, 'error'); return; }
    }
    try { localStorage.removeItem(KEY); } catch {}
    window.removeEventListener('beforeunload', guard);
    App.go('/result.html?id=' + id + '&fresh=1', { replace: true });
  }

  const guard = (e) => { if (!submitting) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', guard);
})();
</script>
</body>
</html>
